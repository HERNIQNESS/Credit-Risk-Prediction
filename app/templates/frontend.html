<script>
const API = 'https://creditguard-xwxi.onrender.com';

async function assessRisk() {
  const btn = document.getElementById('run-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('spinner');
  btn.disabled = true;
  btnText.textContent = 'Analysing...';
  spinner.style.display = 'block';

  const total = parseFloat(document.getElementById('total_amount').value);
  const funded = parseFloat(document.getElementById('amount_funded').value);
  const today = new Date();

  const payload = {
    customer_id: parseInt(document.getElementById('customer_id').value),
    tbl_loan_id: Math.floor(Math.random() * 99999),
    lender_id: parseInt(document.getElementById('lender_id').value),
    Total_Amount: total,
    duration: parseInt(document.getElementById('duration').value),
    Amount_Funded_By_Lender: funded,
    Lender_portion_Funded: parseFloat(document.getElementById('lender_portion').value),
    loan_year: today.getFullYear(),
    interest_amount: parseFloat(document.getElementById('interest_amount').value),
    repayment_ratio: parseFloat(document.getElementById('repayment_ratio').value),
    lender_profit: funded * 0.1,
    loan_month: today.getMonth() + 1,
    loan_dayofweek: today.getDay(),
    loan_quarter: Math.ceil((today.getMonth() + 1) / 3),
    customer_loan_count: parseInt(document.getElementById('loan_count').value),
    loan_type: "Type_1",
    New_versus_Repeat: document.getElementById('customer_type').value
  };

  try {
    const res = await fetch(`${API}/predict`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    renderResult(data);
  } catch(e) {
    renderError();
  }

  btn.disabled = false;
  btnText.textContent = 'Run AI Prediction Engine';
  spinner.style.display = 'none';
}

function renderResult(data) {
  const prob = Math.round(data.default_probability * 100);
  const level = data.risk_level.toLowerCase();

  const colors = {low: 'var(--green)', medium: 'var(--yellow)', high: 'var(--red)'};
  const barColors = {
    low: 'linear-gradient(90deg,#059669,#10b981)',
    medium: 'linear-gradient(90deg,#d97706,#f59e0b)',
    high: 'linear-gradient(90deg,#b91c1c,#ef4444)'
  };
  const badges = {low: '✓ Low Risk Profile', medium: '⚠ Medium Risk Profile', high: '✕ High Risk Profile'};
  const tags = {low: 'LOW RISK', medium: 'REVIEW REQUIRED', high: 'HIGH RISK'};
  const decisions = {
    low: 'Application is within acceptable risk parameters. Standard approval process may proceed. Monitor repayment behaviour through first three cycles.',
    medium: 'Moderate risk detected. Request supporting documentation — payslips or 3-month bank statements. Consider reduced loan amount to lower lender exposure.',
    high: 'High default probability detected. Do not approve without further due diligence. Consider requesting collateral, a guarantor, or declining the application.'
  };
  const labels = {low: 'APPROVED — PROCEED', medium: 'CAUTION — REVIEW', high: 'DECLINE RECOMMENDED'};

  document.getElementById('prob-number').textContent = `${prob}%`;
  document.getElementById('prob-number').style.color = colors[level];
  document.getElementById('risk-badge').textContent = badges[level];
  document.getElementById('risk-badge').className = `risk-badge ${level}`;
  document.getElementById('prob-bar').style.width = `${prob}%`;
  document.getElementById('prob-bar').style.background = barColors[level];
  document.getElementById('result-tag').textContent = tags[level];

  const interest = parseFloat(document.getElementById('interest_amount').value);
  const ratio = parseFloat(document.getElementById('repayment_ratio').value);
  const duration = parseInt(document.getElementById('duration').value);
  const loanCount = parseInt(document.getElementById('loan_count').value);

  const d1 = Math.min(Math.round((interest / 50000) * 80 + 20), 95);
  const d2 = Math.min(Math.round((ratio - 1) * 100), 90);
  const d3 = Math.min(Math.round((1 / duration) * 300 + 10), 75);
  const d4 = Math.min(Math.round((1 / loanCount) * 50 + 10), 60);

  setDriver('d1', d1);
  setDriver('d2', d2);
  setDriver('d3', d3);
  setDriver('d4', d4);

  document.getElementById('decision-box').className = `decision-box ${level}`;
  document.getElementById('decision-label').className = `decision-label ${level}`;
  document.getElementById('decision-label').textContent = labels[level];
  document.getElementById('decision-text').textContent = decisions[level];
}

function setDriver(id, pct) {
  document.getElementById(`${id}-pct`).textContent = `${pct}%`;
  document.getElementById(`${id}-bar`).style.width = `${pct}%`;
}

function renderError() {
  document.getElementById('prob-number').textContent = '!';
  document.getElementById('prob-number').style.color = 'var(--red)';
  document.getElementById('risk-badge').textContent = 'Connection Error';
  document.getElementById('risk-badge').className = 'risk-badge high';
  document.getElementById('decision-text').textContent = 'Could not connect to the API. Make sure the FastAPI server is running at http://127.0.0.1:8000 then try again.';
}
</script>
